<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <rect width="128" height="128" rx="16" fill="#2c3e50"/>
  <!-- Central broadcast node -->
  <circle cx="64" cy="40" r="14" fill="#3498db"/>
  <!-- Connection lines -->
  <line x1="64" y1="40" x2="34" y2="84" stroke="#7f8c8d" stroke-width="4"/>
  <line x1="64" y1="40" x2="64" y2="88" stroke="#7f8c8d" stroke-width="4"/>
  <line x1="64" y1="40" x2="94" y2="84" stroke="#7f8c8d" stroke-width="4"/>
  <!-- Target host nodes -->
  <circle cx="34" cy="88" r="10" fill="#2ecc71"/>
  <circle cx="64" cy="94" r="10" fill="#2ecc71"/>
  <circle cx="94" cy="88" r="10" fill="#2ecc71"/>
  <!-- Broadcast waves -->
  <circle cx="64" cy="40" r="22" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
